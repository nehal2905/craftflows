<!doctype html>
<html lang="en" class="js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Crafted Flows</title>
  <meta name="description" content="Crafted Flows makes promotional videos that win your business customers, and builds the automations that give your team its time back. Done for you, start to finish." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.craftedflows.com/" />
  <link rel="alternate" type="application/rss+xml" title="Crafted Flows Blog" href="https://www.craftedflows.com/rss.xml" />
  <meta name="theme-color" content="#0A0A0A" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Crafted Flows" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Crafted Flows" />
  <meta property="og:description" content="Videos that sell. Automations that save hours. Done for you, start to finish." />
  <meta property="og:url" content="https://www.craftedflows.com/" />
  <meta property="og:image" content="https://www.craftedflows.com/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Crafted Flows: promotional videos and business automations, done for you" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Crafted Flows" />
  <meta name="twitter:description" content="Videos that sell. Automations that save hours. Done for you, start to finish." />
  <meta name="twitter:image" content="https://www.craftedflows.com/assets/og.png" />
  <meta name="twitter:image:alt" content="Crafted Flows: promotional videos and business automations, done for you" />

  <!-- Favicon. /favicon.ico (16 to 64px, full colour) is what crawlers fetch
       first; Google Search wants a square icon in a multiple of 48px. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/assets/mark.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />

  <!-- Fonts are self-hosted (declared in the bundled CSS): zero third-party
       connections. Preload the weights the hero paints with so the swap
       window is effectively zero on same-origin HTTP/2. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/satoshi-500.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/satoshi-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/satoshi-700.woff2" crossorigin />
  <!-- JetBrains Mono paints the hero badge + proof labels (above the fold) -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin />

  <!-- Structured data: Organization + ContactPoint, WebSite, Service.
       FAQ answers mirror src/components/Faq.jsx - keep both in sync. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://www.craftedflows.com/#organization",
    "name": "Crafted Flows",
    "url": "https://www.craftedflows.com/",
    "logo": "https://www.craftedflows.com/assets/favicon-512.png",
    "description": "Done-for-you studio. Promotional videos that win customers, and automations that win back your time.",
    "email": "admin@craftedflows.com",
    "sameAs": [
      "https://www.linkedin.com/company/craftedflowsai/",
      "https://www.instagram.com/crafted.flows?igsh=MWRzeW95am9iank5NQ%3D%3D&utm_source=qr"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "sales",
      "email": "admin@craftedflows.com",
      "availableLanguage": "English"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://www.craftedflows.com/#website",
    "url": "https://www.craftedflows.com/",
    "name": "Crafted Flows",
    "description": "Videos that sell. Automations that save hours. Done for you.",
    "publisher": { "@id": "https://www.craftedflows.com/#organization" }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "@id": "https://www.craftedflows.com/#service-video",
    "name": "Promotional video production",
    "serviceType": "Video production",
    "provider": { "@id": "https://www.craftedflows.com/#organization" },
    "url": "https://www.craftedflows.com/video",
    "description": "Promotional videos for businesses: social ads, brand films, product launches, explainers and more. Done for you, ready to publish.",
    "areaServed": "Worldwide"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "@id": "https://www.craftedflows.com/#service-automation",
    "name": "Business Automation & AI Workflow Development",
    "serviceType": "Business process automation",
    "provider": { "@id": "https://www.craftedflows.com/#organization" },
    "url": "https://www.craftedflows.com/automation",
    "description": "Custom-built business automations and AI workflows: client reporting, onboarding, lead routing, invoicing, and internal operations, wired into the tools you already use. Fixed build fee plus monthly retainer, delivered in one to three weeks.",
    "areaServed": "Worldwide",
    "offers": {
      "@type": "Offer",
      "description": "Fixed build fee plus a monthly retainer for monitoring and maintenance. If the automation doesn't save the promised hours, you don't pay."
    }
  }
  </script>
  <!-- FAQPage for first paint; kept in sync with src/data/faqs.js HOME_FAQS. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What does Crafted Flows do?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Two things, both done for you. We make promotional videos that help your business get seen and sell more, and we build automations that take repetitive work off your team."
        }
      },
      {
        "@type": "Question",
        "name": "What kinds of video do you make?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Brand films, social ads for Reels, TikTok and Shorts, product launch films, explainers, UGC-style ads, 3D product showcases, motion logos, and billboard and digital-screen campaigns."
        }
      },
      {
        "@type": "Question",
        "name": "Do you write the video script?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. We write the script and the storyboard, and you approve both before we make anything."
        }
      },
      {
        "@type": "Question",
        "name": "How much does automation cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A fixed build fee, quoted up front after the audit, based on the workflow's complexity, plus a monthly retainer for monitoring and maintenance. No hourly billing, no surprises. And if the automation doesn't save the hours we promised, you don't pay."
        }
      },
      {
        "@type": "Question",
        "name": "How long does an automation build take?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Most automations ship in one to three weeks from kickoff. The audit itself takes 15 minutes, and you'll have a scoped proposal within two business days of it."
        }
      },
      {
        "@type": "Question",
        "name": "What software do your automations work with?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The tools businesses already run: Slack, Notion, HubSpot, Airtable, Google Workspace, Asana, ClickUp, Stripe, and hundreds more via Zapier, Make, or direct APIs. If your stack has an API, we can almost certainly wire it in."
        }
      }
    ]
  }
  </script>
</head>

  <div id="root"></div>

    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#0A0A0A;color:#FAFAFA;font-family:'Satoshi','Segoe UI',system-ui,sans-serif;text-align:center;padding:2rem;">
      <p style="font-size:1.5rem;font-weight:700;margin:0;">crafted flows</p>
      <p style="max-width:32rem;line-height:1.6;color:#B9B9BD;margin:0;">

        automations that give your team its time back. This site needs JavaScript, or
        email us at
        <a href="mailto:admin@craftedflows.com" style="color:#FAFAFA;">admin@craftedflows.com</a>.
      </p>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
